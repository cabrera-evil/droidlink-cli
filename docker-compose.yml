services:
  go-template:
    container_name: go-template
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.25"
    image: cabreraevil/go-template:latest
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/configs/config.yaml
    volumes:
      - ./configs:/app/configs:ro
