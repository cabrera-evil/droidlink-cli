name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: cabrera-evil/workflows/.github/workflows/go-release.yaml@master
    with:
      go-version-file: go.mod
      goflags: -mod=readonly
      goreleaser-args: release --clean
    secrets: inherit
