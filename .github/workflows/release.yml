name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_code:
    name: Analyze
    uses: cabrera-evil/workflows/.github/workflows/code-analysis.yaml@master
    with:
      default_branch: ${{ github.event.repository.default_branch }}
      push_before_sha: ${{ github.event.before }}
      push_base_sha: ${{ github.event.base_ref }}
    secrets: inherit

  release:
    name: Release
    needs: [analyze_code]
    uses: cabrera-evil/workflows/.github/workflows/go-semantic-release.yaml@master
    secrets: inherit

  build:
    name: Build
    needs: [release]
    if: needs.release.outputs.released == 'true'
    uses: cabrera-evil/workflows/.github/workflows/go-release.yaml@master
    with:
      go-version-file: go.mod
      goflags: -mod=readonly
      goreleaser-args: release --clean
    secrets: inherit
